<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">


        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap"
      rel="stylesheet">


        <link rel="stylesheet" href="/css/styles.css">
        <title>Login</title>
    </head>
    <body class="bg-light text-dark">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-md-10">
                    <div class="card mt-5" style="width: 100%; height: 100%; margin: 0 auto; ">

                    <div class="card-body"
                            style="
                                display: flex;
                                flex-direction: row;

                        
                              
                                padding: 0;
                                    ">
                            <div class="login-container d-flex" style="gap: 20px; margin-right: auto;">

                                <div class="login-img" style="display: flex; flex-direction: column; align-items: center; position: relative; width: 450px;">
                                    
                                  
                                    <img src="/images/pexels-zehra-k-710717493-30596423.jpg" alt="Login Image" class="img-fluid" style="max-width: 100%; height: auto; filter: blur(2px); width: 1000px;">

                                    <img src="/images/costco logo.svg" alt="Costco Logo" style="position: absolute; top: 25px; left: 5%; width: 300px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.9));">

                                    <h1 style="position: absolute; top: 20%; left: 8%; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); font-weight: bold; font-size: 55px;">Bakery<br> Management</h1>
                                    <p style="position: absolute; top: 38%; left: 8%; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); font-size: 20px; font-weight: 400;">Orders •  Inventory • <br> Reports •  Staff •  Customers</p>

                                    <hr style="position: absolute; top: 47%; left: 8%; width: 10%; border: 2px solid white; background-color: white; opacity: 1;">

                                    <p style="position: absolute; top: 53%; left: 8%; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); font-size: 16px; font-weight: 400; letter-spacing: 2px;">FRESH PRODUCTS<br> BETTER OPERATIONS<br> STRONGER TOMORROW</p>

                                    <h2 style="position: absolute; top: 65%; left: 27%; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); font-size: 60px; font-weight: 400; font-family: 'Caveat', cursive; transform: rotate(20deg); opacity: 0.9; color: #ffffff">Freshness<br> <span style="position: relative; top: -10px; right: 20px">starts<br></span> <span style="position: relative; top: -20px; right: -20px">at<br></span> <span style="position: relative; top: -30px; right: 10px">Costco</span></h2>

                                    <div class="slogan-line" style="width: 80px; height: 10px; background-color: white; position: absolute; top: 94%; left: 20%; transform: rotate(20deg); border-radius: 10% 25% 50% 50%; border-bottom: 2px solid white;"></div>
                            
                              

                                </div>
                            </div> <!-- Close login-img -->
                        
                        

                            <!-- Login Form Section styled with flexbox -->
                            <div class="login-form"
                                style="
                                    flex: 1;
                                    display: flex;
                                    flex-direction: column;
                                    justify-content: center;
                                    align-items: flex-start;
                                    margin-left: 130px;
                                        ">

                            <h2 class="card-title text-center">Login</h2>
                            <form th:action="@{/login}" method="post" style="width: 300px;">
                                <div class="mb-3">

                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                
                                <div class="d-grid d-flex justify-content-center">
                                    <button type="submit" class="btn btn-primary w-25">Login</button>
                                </div>
                            </form>
                        </div>
                        </div> <!-- Close login-container -->
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
