<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/icons-animations.css">
    <link rel="stylesheet" href="/css/tables.css">
    <title>Staff</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="bg-light text-dark">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" 
            style="background-color: #343a40; width: 10%; z-index: 1000; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; padding-top: 20px;">

            <h1 class="navbar-brand mb-0 h1 text-center" style="font-size: 1.5rem; margin-top: 20px; font-size: 20px;">Staff</h1>

            <hr style="width: 60%; border-top: 2px solid #ffffff; margin: 10px 0; align-items: center; margin-right: 15px;">

            <ul class="nav flex-column text-left d-flex" style="margin-top: 70px; font-size: 18px; width: 100%; height: calc(100vh - 70px);">


                <!-- Orders navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/orders">
                        <img src="/svg images/shopping-cart-11-svgrepo-com.svg"
                             alt="Orders"
                             width="25"
                             height="25"
                             class="ml-2 orders-icon" style="filter: invert(100%);"
                    >
                    Orders
                    </a>
                </li>


                <!-- Products navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/products">
                        
                        <img src="/svg images/products-svgrepo-com.svg"
                             alt="Products"
                             width="25"
                             height="25"
                             class="ml-2 products-icon" style="filter: invert(100%);"
                    >
                    Products
                    </a>
                </li>


                <!-- Staff navigation item -->
                <li>
                    <a class="nav-link text-white active" style="object-fit: contain;" href="/staff">
                        <img src="/svg images/call-center-worker-svgrepo-com.svg"
                             alt="Staff"
                             width="25"
                             height="25"
                             class="ml-2 someicon-icon" style="filter: invert(100%);"
                        >
                        Staff
                    </a>
                </li>

                <!-- Customers navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/customers">
                        <img src="/svg images/users-svgrepo-com.svg"
                             alt="Customers"
                             width="25"
                             height="25"
                             class="ml-2 customers-icon" style="filter: invert(100%);"
                    >
                    Customers
                    </a>
                </li>

                <!-- Add Staff navigation item -->
                <li class="nav-item">
                    <a class="staff-tag nav-link text-white" href="/staff/add">
                        <img src="/svg images/add-svgrepo-com.svg"
                             alt="Add Staff"
                             width="25"
                             height="25"
                             class="ml-2 addstaff-icon" style="filter: invert(100%);"
                    >
                        Add Staff
                    </a>
                </li>

                <!-- Divider -->
            <div class="d-flex justify-content-center">
                <hr class="divider w-75" style="border-top: 2px solid #ffffff;">
            </div>

            <li class="nav-item">
                <a class="nav-link text-white" href="/reports">
                    <img src="/svg images/stats-svgrepo-com.svg"
                         alt="Reports"
                         width="25"
                         height="25"
                         class="ml-2" style="filter: invert(100%); margin-bottom: 10px;">
                    Reports
                </a>
            </li>

            <!-- Inventory navigation item -->
            <li class="nav-item">
                <a class="nav-link text-white" href="/inventory">
                    <img src="/svg images/inventory-svgrepo-com.svg"
                         alt="Inventory"
                         width="25"
                         height="25"
                         class="ml-2" style="filter: invert(100%); margin-bottom: 10px;">
                    Inventory
                </a>
            </li>



            <!-- Logout navigation item -->
                <li class="nav-item mt-auto d-flex justify-content-around" style="margin-top: auto; margin-right: 20px;">
                    <a class="nav-link text-white " href="/">
                        <img src="/svg images/logout-svgrepo-com.svg"
                             alt="Logout"
                             width="50"
                             height="50"
                             class="ml-2 logout-icon" style="filter: brightness(0) saturate(100%) invert(18%) sepia(99%)
                                                                saturate(6500%) hue-rotate(357deg) brightness(95%) contrast(115%);"
                    >
                    Logout
                    </a>
                </li>

            
            </ul>



    </nav>







    <div class="container mt-5">
        <h1 class="mb-4" style="font-weight: bold;">Staff</h1>
<table class="table">
    <thead class="table-dark">
        <tr>
            <th>Staff ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Address</th>
            <th>Contact Address</th>
            <th>Contact Email</th>
            <th>Contact Phone</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="staff : ${staff}">

            <td th:text="${staff.staffId}"></td>

            <td th:text="${staff.staffFirstName}"></td>

            <td th:text="${staff.staffLastName}"></td>

            <td th:text="${staff.staffEmail}"></td>

            <td th:text="${staff.staffPhoneNumber}"></td>

            <td th:text="${staff.staffRole}"></td>

            <td th:text="${staff.staffAddress}"></td>

            <td th:text="${staff.staffContactAddress}"></td>

            <td th:text="${staff.staffContactEmail}"></td>

            <td th:text="${staff.staffContactPhone}"></td>

            <td>
                <a th:href="@{/staff/edit/{id}(id=${staff.staffId})}"
                   title="Edit staff">
                    <img src="/images/edit.png"
                         alt="Edit"
                         width="25"
                         height="25">
                </a>

                <a th:href="@{/staff/delete/{id}(id=${staff.staffId})}"
                   title="Delete staff">
                    <img src="/images/delete.png"
                         alt="Delete"
                         width="25"
                         height="25"
                         onclick="return confirm('Are you sure you want to delete this staff member?')">
                </a>
            </td>

        </tr>
    </tbody>
</table>
    </div>
</body>
</html>
