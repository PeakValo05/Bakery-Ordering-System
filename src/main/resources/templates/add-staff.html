<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/icons-animations.css">

    <title>Add Staff</title>
</head>


<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card border-0 shadow-lg rounded-4 w-100"
             style="max-width: 550px;">

            <div class="card-body p-4 p-md-5">

<form th:action="@{/staff/save}" th:object="${staff}" method="post">

    <div class="mb-3">
        <label for="staffFirstName" class="form-label"><b>First Name</b></label>
        <input type="text"
               class="form-control"
               id="staffFirstName"
               th:field="*{staffFirstName}">
    </div>

    <div class="mb-3">
        <label for="staffLastName" class="form-label"><b>Last Name</b></label>
        <input type="text"
               class="form-control"
               id="staffLastName"
               th:field="*{staffLastName}">
    </div>

    <div class="mb-3">
        <label for="staffEmail" class="form-label"><b>Email</b></label>
        <input type="email"
               class="form-control"
               id="staffEmail"
               th:field="*{staffEmail}">
    </div>

    <div class="mb-3">
        <label for="staffPhoneNumber" class="form-label"><b>Phone Number</b></label>
        <input type="text"
               class="form-control"
               id="staffPhoneNumber"
               th:field="*{staffPhoneNumber}">
    </div>

        <section id="staffRole" class="mb-3">
            <label for="staffRole" class="form-label"><b>Staff Role</b></label>
                    <select class="form-select form-select-lg"
                            th:field="*{staffRole}"
                            required>


                <option value="">Select a role</option>
                <option value="Baker">Baker</option>
                <option value="Wrapper">Wrapper</option>
                <option value="Decorator">Decorator</option>
                <option value="Wrapper/Cleaner">Wrapper/Cleaner</option>
                <option value="Supervisor">Supervisor</option>
                <option value="Cleaner">Cleaner</option>
                <option value="Manager">Manager</option>


                    </select>
                </section>

    <div class="mb-3">
        <label for="staffAddress" class="form-label"><b>Address</b></label>
        <input type="text"
               class="form-control"
               id="staffAddress"
               th:field="*{staffAddress}">
    </div>

    <div class="mb-3">
        <label for="staffContactAddress" class="form-label"><b>Emergency Contact Address</b></label>
        <input type="text"
               class="form-control"
               id="staffContactAddress"
               th:field="*{staffContactAddress}">
    </div>

    <div class="mb-3">
        <label for="staffContactEmail" class="form-label"><b>Emergency Contact Email</b></label>
        <input type="email"
               class="form-control"
               id="staffContactEmail"
               th:field="*{staffContactEmail}">
    </div>

    <div class="mb-3">
        <label for="staffContactPhone" class="form-label"><b>Emergency Contact Phone</b></label>
        <input type="text"
               class="form-control"
               id="staffContactPhone"
               th:field="*{staffContactPhone}">
    </div>

    <!-- Submit and Back buttons -->
    <div class="mb-3 d-flex justify-content-center">
        <button type="submit" class="btn btn-primary">
            Add Staff Member
        </button>

        <!-- Back button -->
        <button type="button" class="btn btn-secondary ms-2" onclick="history.back()">
            Back
        </button>
    </div>

</form>
        </div>
    </div>
</body>



</html>
