<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Orders</title>
</head>
<body class="bg-light text-dark">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" 
            style="background-color: #343a40; width: 10%; z-index: 1000; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; padding-top: 20px;">

            <h1 class="navbar-brand mb-0 h1 text-center" style="font-size: 1.5rem; margin-top: 20px; font-size: 20px;">Bakery Ordering</h1>

            <hr style="width: 40%; border-top: 2px solid #ffffff; margin: 10px 0; align-items: center; margin-right: 25px;">

            <ul class="nav flex-column text-left d-flex" style="margin-top: 70px; font-size: 18px; width: 100%; height: calc(100vh - 70px);">

                <li class="nav-item">
                    <a class="nav-link text-white" href="/orders">Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/products">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/customers">Customers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/customers/add">Add Customer</a>
                </li>
                <li class="nav-item mt-auto">
                    <a class="nav-link text-white" href="/">Logout</a>
                </li>

            
            </ul>



    </nav>







    <div class="container mt-5">
        <h1 class="mb-4" style="font-weight: bold;">Customers</h1>
<table class="table">
    <thead class="table-dark" style="background-color: #343a40; color: #ffffff;">
        <tr>
            <th>Customer ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.customerId}"></td>
            <td th:text="${customer.firstName}"></td>
            <td th:text="${customer.lastName}"></td>
            <td th:text="${customer.email}"></td>
            <td th:text="${customer.phoneNumber}"></td>
            <td>
                <a th:href="@{/customers/delete/{id}(id=${customer.customerId})}"
   title="Delete customer">

    <img src="images/delete.png"
         alt="Delete"
         width="22"
         height="22">
</a>
                <a th:href="@{/customers/edit/{id}(id=${customer.customerId})}"
   title="Edit customer">

    <img src="images/edit.png"
         alt="Edit"
         width="22"
         height="22">
</a>
            </td>
        </tr>
    </tbody>
    

</table>
    </div>
</body>
</html>
