<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Icons and animations CSS -->
    <link rel="stylesheet" href="/css/icons-animations.css">
    <link rel="stylesheet" href="/css/tables.css">


    <title>Customers</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body class="bg-light text-dark">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" 
            style="background-color: #343a40; width: 10%; z-index: 1000; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; padding-top: 20px;">

            <h1 class="navbar-brand mb-0 h1 text-center" style="font-size: 1.5rem; margin-top: 20px; font-size: 20px;">Customers</h1>

            <hr style="width: 60%; border-top: 2px solid #ffffff; margin: 10px 0; align-items: center; margin-right: 15px;">

            <ul class="nav flex-column text-left d-flex" style="margin-top: 70px; font-size: 18px; width: 100%; height: calc(100vh - 70px);">

                <li class="nav-item">
                    <a class="nav-link text-white" href="/orders">
                        <img src="/svg images/shopping-cart-11-svgrepo-com.svg"
                             alt="Orders"
                             width="25"
                             height="25"
                             class="ml-2" style="filter: invert(100%);"
                             
                    >
                    Orders
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/products">
                        
                        <img src="/svg images/products-svgrepo-com.svg"
                             alt="Products"
                             width="25"
                             height="25"
                            class="ml-2" style="filter: invert(100%);">
                            Products
                            
                    </a>
                </li>


                <!-- Staff navigation item -->
                <li>
                    <a class="nav-link text-white" href="/staff">
                        <img src="/svg images/call-center-worker-svgrepo-com.svg"
                             alt="Staff"
                             width="25"
                             height="25"
                             class="ml-2 someicon-icon" style="filter: invert(100%);"
                        >
                        Staff
                    </a>
                </li>
                <!-- Customers navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white active" href="/customers">
                        <img src="/svg images/users-svgrepo-com.svg"
                             alt="Customers"
                             width="25"
                             height="25"
                             class="ml-2" style="filter: invert(100%);">
                             Customers
                    </a>
                </li>

            <div class="d-flex justify-content-center">
                <hr class="divider w-75" style="border-top: 2px solid #ffffff;">
            </div>

            <!-- Reports navigation item -->
            <li class="nav-item">
                <a class="nav-link text-white" href="/reports">
                    <img src="/svg images/stats-svgrepo-com.svg"
                         alt="Reports"
                         width="25"
                         height="25"
                         class="ml-2" style="filter: invert(100%); margin-bottom: 10px;">
                    Reports
                </a>
            </li>

            <!-- Inventory navigation item -->
            <li class="nav-item">
                <a class="nav-link text-white" href="/inventory">
                    <img src="/svg images/inventory-svgrepo-com.svg"
                         alt="Inventory"
                         width="25"
                         height="25"
                         class="ml-2" style="filter: invert(100%); margin-bottom: 10px;">
                    Inventory
                </a>
            </li>





                <!-- Divider -->
                <li class="nav-item mt-auto d-flex justify-content-around">
                    <a class="nav-link text-white " href="/">
                    </a>
                </li>

                

                <!-- Menu item for logout -->
                <li class="nav-item mt-auto d-flex justify-content-around" style="margin-top: auto; margin-right: 20px;">
                    <a class="nav-link text-white " href="/">
                        <img src="/svg images/logout-svgrepo-com.svg"
                             alt="Logout"
                             width="50"
                             height="50"
                             class="ml-2 logout-icon" style="    filter: brightness(0) saturate(100%) invert(18%) sepia(99%)
                                                                saturate(6500%) hue-rotate(357deg) brightness(95%) contrast(115%);"
                    >
                    Logout
                    </a>

                    


                </li>



            
            </ul>



    </nav>







    <div class="container mt-5">
        <h1 class="mb-4" style="font-weight: bold;">Customers</h1>
<table class="table">
    <thead class="table-dark" style="background-color: #343a40; color: #ffffff;">
        <tr>
            <th>Customer ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Items in Cart</th>
            <th>Actions</th>
            
        </tr>
    </thead>

    <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.customerId}"></td>
            <td th:text="${customer.firstName}"></td>
            <td th:text="${customer.lastName}"></td>
            <td th:text="${customer.email}"></td>
            <td th:text="${customer.phoneNumber}"></td>
            <td th:text="${customer.itemsInCart}"></td>
            <td>
                <a th:href="@{/customers/edit/{id}(id=${customer.customerId})}"
                   title="Edit customer">
                    <img src="/images/edit.png"
                         alt="Edit"
                         width="25"
                         height="25">
                </a>

                <a th:href="@{/customers/delete/{id}(id=${customer.customerId})}"
                   title="Delete customer">
                    <img src="/images/delete.png"
                         alt="Delete"
                         width="25"
                         height="25"
                         onclick="return confirm('Are you sure you want to delete this customer?')">
                </a>
            </td>
        </tr>
    </tbody>
    

</table>
    </div>
</body>
</html>
