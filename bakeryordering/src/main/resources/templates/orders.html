<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/icons-animations.css">
    <title>Orders</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="bg-light text-dark">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" 
            style="background-color: #343a40; width: 10%; z-index: 1000; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; padding-top: 20px;">

            <h1 class="navbar-brand mb-0 h1 text-center" style="font-size: 1.5rem; margin-top: 20px; font-size: 20px;">Orders</h1>

            <hr style="width: 60%; border-top: 2px solid #ffffff; margin: 10px 0; align-items: center; margin-right: 15px;">

            <ul class="nav flex-column text-left d-flex" style="margin-top: 70px; font-size: 18px; width: 100%; height: calc(100vh - 70px);">


                <!-- Orders navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/orders">
                        <img src="/images/orders.png"
                             alt="Orders"
                             width="30"
                             height="30"
                             class="ml-2 orders-icon"
                    >
                    Orders
                    </a>
                </li>


                <!-- Products navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/products">
                        
                        <img src="/images/products.png"
                             alt="Products"
                             width="30"
                             height="30"
                             class="ml-2 products-icon"
                    >
                    Products
                    </a>
                </li>
                <!-- Customers navigation item -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/customers">
                        <img src="/images/customers.png"
                             alt="Customers"
                             width="30"
                             height="30"
                             class="ml-2 customers-icon"
                    >
                    Customers
                    </a>
                </li>

                <!-- Staff navigation item -->
                <li>
                    <a class="nav-link text-white" style="object-fit: contain;" href="/staff">
                        <img src="/images/staff.png"
                             alt="Staff"
                             width="30"
                             height="30"
                             class="ml-2 someicon-icon"
                        >
                        Staff
                    </a>
                </li>

                <!-- Add Order navigation item -->
                <li class="nav-item">
                    <a class="orders-tag nav-link text-white" href="/orders/add">
                        <img src="/images/addorder.png"
                             alt="Add Order"
                             width="30"
                             height="30"
                             class="ml-2 addorder-icon"
                    >
                        Add Order
                    </a>
                </li>



                <li class="nav-item mt-auto d-flex justify-content-around">
                    <a class="nav-link text-white " href="/">
                        <img src="/images/logout.png"
                             alt="Logout"
                             width="50"
                             height="50"
                             class="ml-2 logout-icon"
                    >
                    </a>
                </li>

            
            </ul>



    </nav>







    <div class="container mt-5">
        <h1 class="mb-4" style="font-weight: bold;">Orders</h1>
<table class="table">
    <thead class="table-dark">
        <tr>
            <th>Order ID</th>
            <th>Customer ID</th>
            <th>Customer Name</th>
            <th>Order Date</th>
            <th>Pickup Date</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="order : ${orders}">

            <td th:text="${order.orderId}"></td>

            <td th:text="${order.customer.customerId}"></td>

            <td th:text="${order.customer.firstName + ' ' +
                          order.customer.lastName}">
            </td>

            <td th:text="${order.orderDate}"></td>

            <td th:text="${order.pickupDate}"></td>

            <td th:text="${order.orderStatus}"></td>

            <td th:text="${order.totalPrice}"></td>

            <td>
                <a th:href="@{/orders/edit/{id}(id=${order.orderId})}"
                   title="Edit order">
                    <img src="/images/edit.png"
                         alt="Edit"
                         width="25"
                         height="25">
                </a>

                <a th:href="@{/orders/delete/{id}(id=${order.orderId})}"
                   title="Delete order">
                    <img src="/images/delete.png"
                         alt="Delete"
                         width="25"
                         height="25"
                         onclick="return confirm('Are you sure you want to delete this order?')">
                </a>
            </td>

        </tr>
    </tbody>
</table>
    </div>
</body>
</html>
