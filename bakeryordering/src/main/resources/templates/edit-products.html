<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/icons-animations.css">

    <title>Edit Product</title>
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card border-0 shadow-lg rounded-4 w-100"
         style="max-width: 550px;">

        <div class="card-body p-4 p-md-5">

            <h2 class="text-center fw-bold mb-2">
                Edit Product
            </h2>

            <p class="text-center text-muted mb-4">
                Enter the product information below.
            </p>

            <form th:action="@{/products/save}"
                  th:object="${product}"
                  method="post">

                <!-- Product Name -->
                <section id="productName" class="mb-3"></section>
                    <select class="form-select form-select-lg"
                            th:field="*{productName}"
                            required>


                <option value="">Select a product</option>
                <option value="Danish">Cherry Danish</option>
                <option value="Danish">Apple Danish</option>
                <option value="Cake">Chocolate Cake</option>
                <option value="Danish">Cheese Danish</option>
                <option value="Cookie">Chocolate Chip Cookie</option>
                <option value="Muffin">Blueberry Muffin</option>


                    </select>
                </section>
                <!-- Description -->
                <div class="mb-3">
                    <label for="description"
                           class="form-label">
                        Description
                    </label>

                    <textarea id="description"
                              class="form-control form-control-lg"
                              th:field="*{description}"
                              rows="3"
                              placeholder="Enter a short description"></textarea>
                </div>

                <!-- Price -->
                <div class="mb-3">
                    <label for="price"
                           class="form-label">
                        Price
                    </label>

                    <input type="number"
                           id="price"
                           class="form-control form-control-lg"
                           th:field="*{price}"
                           min="0"
                           step="0.01"
                           placeholder="10.00"
                           required>
                </div>

                <!-- Quantity -->
                <div class="mb-4">
                    <label for="quantity"
                           class="form-label">
                        Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           class="form-control form-control-lg"
                           th:field="*{quantity}"
                           min="0"
                           placeholder="1"
                           required>
                </div>



                
    <!-- Submit and Back buttons -->
    <div class="mb-3 d-flex justify-content-center">
        <button type="submit" class="btn btn-primary">
            Edit Product
        </button>

        <!-- Back button -->
        <button type="button" class="btn btn-secondary ms-2" onclick="history.back()">
            Back
        </button>
    </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
