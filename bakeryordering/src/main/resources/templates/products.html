<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/icons-animations.css">
    <title>Products</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body class="bg-light text-dark">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" 
            style="background-color: #343a40; width: 10%; z-index: 1000; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; padding-top: 20px;">

            <h1 class="navbar-brand mb-0 h1 text-center" style="font-size: 1.5rem; margin-top: 20px; font-size: 20px;">Products</h1>

            <hr style="width: 60%; border-top: 2px solid #ffffff; margin: 10px 0; align-items: center; margin-right: 15px;">

            <ul class="nav flex-column text-left d-flex" style="margin-top: 70px; font-size: 18px; width: 100%; height: calc(100vh - 70px);">

                <li class="nav-item">
                    <a class="nav-link text-white" href="/orders">
                        <img src="/images/orders.png"
                             alt="Orders"
                             width="30"
                             height="30"
                             class="ml-2">
                        Orders
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/products">
                        <img src="/images/products.png"
                             alt="Products"
                             width="30"
                             height="30"
                             class="ml-2">
                             Products
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/customers">
                        <img src="/images/customers.png"
                             alt="Customers"
                             width="30"
                             height="30"
                             class="ml-2">
                             Customers
                    </a>
                </li>
                
                <!-- Staff navigation item -->
                <li>
                    <a class="nav-link text-white" href="/staff">
                        <img src="/images/staff.png"
                             alt="Staff"
                             width="30"
                             height="30"
                             class="ml-2 someicon-icon"
                        >
                        Staff
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link text-white" href="/products/add">
                        <img src="/images/addproduct.png"
                             alt="Add Product"
                             width="30"
                             height="30"
                             class="ml-2">
                             Add Product
                    </a>

                </li>
                <li class="nav-item mt-auto d-flex justify-content-around">
                    <a class="nav-link text-white" href="/">
                        <img src="/images/logout.png"
                             alt="Logout"
                             width="70"
                             height="70"
                             class="ml-2">
                    </a>
                </li>

            
            </ul>



    </nav>







    <div class="container mt-5">
        <h1 class="mb-4" style="font-weight: bold;">Products</h1>
<table class="table">
    <thead class="table-dark">
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Description</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="product : ${products}">

            <td th:text="${product.productsId}"></td>

            <td th:text="${product.productName}"></td>

            <td th:text="${product.price}"></td>

            <td th:text="${product.description}"></td>

            <td th:text="${product.quantity}"></td>

            <td>
                <a th:href="@{/products/edit/{id}(id=${product.productsId})}"
                   title="Edit product">
                    <img src="/images/edit.png"
                         alt="Edit"
                         width="25"
                         height="25">
                </a>

                <a th:href="@{/products/delete/{id}(id=${product.productsId})}"
                   title="Delete product">
                    <img src="/images/delete.png"
                         alt="Delete"
                         width="25"
                         height="25"
                         onclick="return confirm('Are you sure you want to delete this product?')">
                </a>
            </td>

        </tr>
    </tbody>
</table>
    </div>
</body>
</html>
